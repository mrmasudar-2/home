        @keyframes wavePulse { from { height: 10px; } to { height: 50px; } }

        .step-bar { width: 12px; background: var(--gold-gradient); border-radius: 3px; }

        .ai-nodes { display: flex; gap: 15px; align-items: center; justify-content: center; }
        .node-circle { width: 12px; height: 12px; background: var(--gold-primary); border-radius: 50%; box-shadow: 0 0 12px var(--gold-primary); animation: nodePulse 1.5s infinite alternate; }
        @keyframes nodePulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 1; } }

        .sync-line { height: 2px; width: 140px; background: var(--gold-gradient); position: relative; overflow: hidden; border-radius: 2px; }
        .sync-ball { width: 8px; height: 8px; background: #fff; border-radius: 50%; position: absolute; top: -3px; animation: moveBall 2s infinite linear; box-shadow: 0 0 10px #fff; }
        @keyframes moveBall { 0% { left: 0; } 100% { left: 100%; } }

        .shield-meter { width: 75%; height: 6px; background: #111; border-radius: 3px; margin: 0 auto; overflow: hidden; border: 1px solid var(--gold-primary); position: relative; }
        .shield-progress { height: 100%; width: 100%; background: var(--gold-gradient); animation: secureGlow 2s infinite; }

        const name = document.getElementById('reqName').value.trim();
        const email = document.getElementById('reqEmail').value.trim();
        const country = document.getElementById('reqCountrySelect').value;
        const phone = document.getElementById('reqDialCodeSelect').value + document.getElementById('reqWhatsApp').value;

            alert("Please fill in all mandatory fields including country and WhatsApp number.");

        document.getElementById('reqEmail').value = '';
        document.getElementById('reqCountrySelect').value = '';
        document.getElementById('reqWhatsApp').value = '';
